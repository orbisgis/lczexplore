name: RCheck
on:
  push:
    branches: [ afterMultipleComparisons, master ]
  pull_request:
    branches: [ afterMultipleComparisons, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        r-version: ['4.5.2']
    steps:
      - uses: actions/checkout@v4
      - name: Set up R ${{ matrix.r-version }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudunits2-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libuv1-dev \
            pandoc
      - name: Install dependencies
        run: |
          install.packages(c("remotes", "rcmdcheck", "rmarkdown"), repos = "https://cloud.r-project.org/")
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}
      - uses: r-lib/actions/setup-tinytex@v2
      - name: Check
        run: rcmdcheck::rcmdcheck(build_args =c("--no-build-vignettes", "--resave-data"), args = c("--no-build-vignettes", "--no-vignettes"), error_on = "error")
        shell: Rscript {0}
